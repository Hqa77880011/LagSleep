[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagsleep"
version = "0.1.0"
description = "Decision-aware clock-offset marginalization for sleep staging implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
lagsleep = "lagsleep.cli:main"

[tool.setuptools.packages.find]
include = ["lagsleep*"]
